# Ablation of attn_rotation: rotate ALL 34 temporal attention layers
# (attn1 + attn2 in every TransformerTemporalModel, including
# transformer_in) instead of just the 9 up-block attn1 layers. attn2 in
# these blocks is a second temporal self-attention pass, not text
# cross-attention (see AttentionRotation.apply's docstring), so rotating it
# is well-defined the same way as attn1. Run with:
#   python scripts/train.py --config configs/attn_rotation_all.yaml --hf-repo <you>/revt2v-checkpoints
#
# Identical to attn_rotation.yaml except `rotate_layers` and `target_modules`.

seed: 42
method: attn_rotation

model_id: ali-vilab/text-to-video-ms-1.7b
num_frames: 16
height: 256
width: 256
num_inference_steps: 50
guidance_scale: 9.0

data_root: data/latents
checkpoint_dir: results/checkpoints

lora_rank: 8
lora_alpha: 8
lora_dropout: 0.0
# All 34 temporal attn1+attn2 layers (incl. transformer_in) x (to_v, to_out.0)
# = 68 LoRA-wrapped Linears.
target_modules: '.*(temp_attentions\.\d+|^transformer_in)\.transformer_blocks\.\d+\.attn[12]\.(to_v|to_out\.0)$'

# "all" -> all 34 layers get rotated (asserted in AttentionRotation.apply).
rotate_layers: all

rotation_weight: 0.0

batch_size: 4
learning_rate: 0.0001
num_steps: 1000
grad_accum_steps: 4
uncond_prob: 0.1

hf_repo: null
hf_dataset_repo: null
save_every_steps: 200
push_every_seconds: 600.0

log_every_steps: 20
sample_every_steps: 250
sample_inference_steps: 25
sample_seed: 0
sample_prompts:
  - "A person is bandaging"
  - "A person is bending back"

gradient_checkpointing: false
