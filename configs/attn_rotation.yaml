# Method 2/3 (primary): rotate the 9 up-block temporal self-attention
# (attn1) layers 180 degrees, then a lightweight LoRA fine-tune on those same
# layers. See revt2v/methods/attn_rotation.py. Run with:
#   python scripts/train.py --config configs/attn_rotation.yaml --hf-repo <you>/revt2v-checkpoints
#
# For the 34-layer ablation, override from the CLI instead of a second config:
#   --set rotate_layers=all target_modules='.*(temp_attentions\.\d+|^transformer_in)\.transformer_blocks\.\d+\.attn[12]\.(to_v|to_out\.0)$'

seed: 42
method: attn_rotation

model_id: ali-vilab/text-to-video-ms-1.7b
num_frames: 16
height: 256
width: 256
num_inference_steps: 50
guidance_scale: 9.0

data_root: data/latents
checkpoint_dir: results/checkpoints

# "Lightweight" per the paper: rank stays small since the attention rotation
# does the heavy lifting and LoRA is only cleaning up artifacts.
lora_rank: 8
lora_alpha: 8
lora_dropout: 0.0
# The 9 up_blocks attn1 layers x (to_v, to_out.0) = 18 LoRA-wrapped Linears.
target_modules: '.*up_blocks.*temp_attentions.*attn1\.(to_v|to_out\.0)$'

# "up_attn1" -> exactly the 9 layers above get rotated (asserted in
# AttentionRotation.apply). "all" (34 layers) is the ablation, see header.
rotate_layers: up_attn1

# Ablation-only, inactive by default — see AttentionRotation.loss.
rotation_weight: 0.0

batch_size: 1 # 4 OOM'd on a T4 (14.56 GiB); grad_accum_steps raised to keep the same effective batch of 16
learning_rate: 0.0001
num_steps: 1000
grad_accum_steps: 16
uncond_prob: 0.1

hf_repo: null
hf_dataset_repo: null
save_every_steps: 200
push_every_seconds: 600.0

log_every_steps: 20
sample_every_steps: 250
sample_inference_steps: 25
sample_seed: 0
sample_prompts:
  - "A person is bandaging"
  - "A person is bending back"

gradient_checkpointing: false
