# Shared defaults. Method-specific configs (attn_rotation.yaml, etc.) copy
# this file and only change what differs — see configs/*.yaml.
#
# Override any value from the CLI without editing this file:
#   python scripts/train.py --config configs/default.yaml --set learning_rate=2e-4 num_steps=500

seed: 42
method: baseline # one of: baseline, attn_rotation, motion_prior

# Teacher / data generation
model_id: ali-vilab/text-to-video-ms-1.7b
num_frames: 16
height: 256
width: 256
num_inference_steps: 50
guidance_scale: 9.0

# Paths (left unset here -> revt2v.utils picks Kaggle/Colab/local defaults;
# set explicitly to override)
data_root: data/latents
checkpoint_dir: results/checkpoints

# LoRA
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
# TODO (you fill this in): the temporal self-attention Linear layers to
# attach LoRA to, scoped so peft's suffix matching can't also hit spatial/
# cross-attention — see LEARNING.md step 1 and revt2v.student.build_student's
# docstring. Leaving this null will make student.build_student target
# nothing useful.
target_modules: null

# attn_rotation only: which temporal attention layers get rotated —
# "up_attn1" (9 layers), "all" (34 layers, incl. transformer_in), or "none".
# Ignored by baseline/motion_prior (they never rotate).
rotate_layers: none

# Training
batch_size: 1
learning_rate: 0.0001
num_steps: 1000
grad_accum_steps: 4 # optimizer steps every N micro-batches; num_steps counts optimizer steps
uncond_prob: 0.1 # per-sample probability of swapping in the empty-prompt embedding (CFG dropout)

# Checkpointing / HF Hub (CLI flags --hf-repo/--hf-dataset-repo override these)
hf_repo: null # private HF *model* repo for checkpoints
hf_dataset_repo: null # private HF *dataset* repo latent shards are pulled from if data_root is empty
save_every_steps: 200
push_every_seconds: 600.0

# Logging / periodic sampling
log_every_steps: 20
sample_every_steps: 250
sample_inference_steps: 25
sample_seed: 0
sample_prompts:
  - "A person is bandaging"
  - "A person is bending back"

# Memory
gradient_checkpointing: false
