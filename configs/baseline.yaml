# Method 1/3: naive LoRA fine-tune on reversed latents, no architecture
# change. See revt2v/methods/baseline.py. Run with:
#   python scripts/train.py --config configs/baseline.yaml --hf-repo <you>/revt2v-checkpoints
#
# Identical to attn_rotation.yaml except `method` and `rotate_layers` (which
# baseline ignores anyway) — same LoRA layers/rank/seed/lr/steps/data, so the
# only difference in what actually trains is the rotation itself.

seed: 42
method: baseline

model_id: ali-vilab/text-to-video-ms-1.7b
num_frames: 16
height: 256
width: 256
num_inference_steps: 50
guidance_scale: 9.0

data_root: data/latents
checkpoint_dir: results/checkpoints

lora_rank: 8
lora_alpha: 8
lora_dropout: 0.0
target_modules: '.*up_blocks.*temp_attentions.*attn1\.(to_v|to_out\.0)$'

rotate_layers: none # baseline never rotates; kept for config symmetry

batch_size: 1 # 4 OOM'd on a T4 (14.56 GiB); grad_accum_steps raised to keep the same effective batch of 16
learning_rate: 0.0001
num_steps: 1000
grad_accum_steps: 16
uncond_prob: 0.1

hf_repo: null
hf_dataset_repo: null
save_every_steps: 200
push_every_seconds: 600.0

log_every_steps: 20
sample_every_steps: 250
sample_inference_steps: 25
sample_seed: 0
sample_prompts:
  - "A person is bandaging"
  - "A person is bending back"

gradient_checkpointing: false
